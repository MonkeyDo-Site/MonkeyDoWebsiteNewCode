<article class="history-entry"><div class="history-meta"><h3>{{ action_label }}</h3><span class="caption">{{ event.created_at|date:'M j, Y g:i A' }} · {{ event.actor.username|default:'Customer / system' }}</span></div><dl class="change-list">{% for row in changes %}<div><dt>{{ row.label }}</dt><dd>{{ row.before }} → {{ row.after }}</dd></div>{% endfor %}</dl></article>
