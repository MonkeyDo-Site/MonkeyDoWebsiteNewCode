<section class="price-adjustment" aria-label="Price adjustment"><h3>Price adjustment</h3><dl class="quote-lines"><dt>Original booking total</dt><dd>${{ adjustment.original_total|floatformat:2 }}</dd>{% for row in adjustment.rows %}<dt>{{ row.label }}</dt><dd>{{ row.sign }}${{ row.amount|floatformat:2 }}</dd>{% endfor %}<dt class="adjusted-price-total"><strong>Adjusted total</strong></dt><dd class="adjusted-price-total"><strong>${{ adjustment.total|floatformat:2 }}</strong></dd></dl></section>
