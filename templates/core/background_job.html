{% extends 'core/staff_base.html' %}{% block staff_content %}<h1>Review background task</h1><p>{{ job.created_at|date:'M j, Y g:i A' }} · {{ job.get_state_display }}</p><p>{{ explanation }}</p>{% if error %}<p class="notice">{{ error }}</p>{% endif %}{% if action %}<form method="post" class="panel record-form">{% csrf_token %}<input type="hidden" name="action" value="{{ action }}"><label><input type="checkbox" name="confirm" required> I have reviewed the action above and want to proceed.</label><button class="button">{% if action == 'resume' %}Resume this reviewed task{% else %}Close resolved task{% endif %}</button></form>{% endif %}<a href="{% url 'dashboard' %}">Return to Dashboard</a>{% endblock %}
