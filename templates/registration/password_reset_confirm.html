{% extends 'core/base.html' %}{% block content %}
<section class="login panel">
<h1>Choose a new password</h1>{% if validlink %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="button">Set password</button>
</form>{% else %}
<p>This link is invalid, expired, or already used.</p>
<a href="{% url 'password_reset' %}">Request another link</a>{% endif %}
</section>{% endblock %}
