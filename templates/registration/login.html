{% extends 'core/base.html' %}{% block title %}Staff sign in · MonkeyDo{% endblock %}{% block content %}
<section class="login panel">
<p class="eyebrow">MonkeyDo team</p>
<h1>Welcome back.</h1>
<p>Sign in to the protected test workspace.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}
<input type="hidden" name="next" value="{{ next }}">{% endif %}
<button class="button" type="submit">Sign in</button>
</form><p><a href="{% url 'password_reset' %}">Forgot password?</a></p>
</section>{% endblock %}
